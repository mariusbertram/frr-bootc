# Loads the `vrf` kernel module at boot, before systemd-sysctl.service
# applies /etc/sysctl.d/73-frr-bootc-vrf-strict-mode.conf - without this,
# `net.vrf.strict_mode`'s sysctl node doesn't exist yet at that point (it
# only appears once the vrf module is loaded, which otherwise only
# happens on-demand when the first VRF interface is created, normally
# well after systemd-sysctl.service already ran), so that file's setting
# would silently be a no-op on a fresh boot with no VRF configured yet.
# network-config-sync also re-applies the same sysctl at runtime after
# every successful sync (see config-sync/src/network.rs) as a defensive
# fallback, but this is what makes it actually reliable from boot.
vrf
