# frr-console draws directly to tty1/ttyS0, the same tty the kernel's own
# printk console output goes to - a kernel message (driver/netdev events,
# routine warnings, ...) is written straight to that tty outside of any
# userspace process, so it lands mid-frame regardless of how carefully
# frr-console's own subprocess stdout/stderr is handled (see the "Console
# Dashboard" section of README.md).
#
# kernel.printk fields: console_loglevel default_message_loglevel
# minimum_console_loglevel default_console_loglevel. Setting
# console_loglevel to 4 keeps err(3)-and-more-severe messages appearing on
# the console (including a hard lockup/panic, which the kernel emits at a
# severity that ignores this cap anyway) while dropping the routine
# warning/notice/info noise that would otherwise corrupt the dashboard.
kernel.printk = 4 4 1 7
