# frr-bootc acts as a router: enable IPv4/IPv6 forwarding.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# Routers legitimately receive asymmetric traffic (e.g. BGP multipath,
# route reflectors); the strict reverse-path filter default would drop it.
net.ipv4.conf.all.rp_filter = 0
net.ipv4.conf.default.rp_filter = 0
