# Each tenant gets its own VRF (see README.md's "A Trunk Instead of One
# NIC per Tenant"/"Adding Tenants Without a VM Restart"), and tenants can
# legitimately use overlapping private address space across VRFs. Strict
# mode closes a kernel-level socket-to-VRF binding ambiguity that can
# otherwise arise in exactly that situation - defense in depth alongside
# FRR's own `router bgp ... vrf ...` scoping. Does not affect the
# existing route-leaking design (routes:/route-rules: in
# network-config's nmstate.yml) - that's FIB/PBR based, a separate
# mechanism strict mode doesn't touch.
#
# `net.vrf.strict_mode`'s sysctl node only exists once the `vrf` kernel
# module is loaded - without help, that only happens on-demand on first
# VRF interface creation, normally *after* systemd-sysctl.service already
# applied this file, which would make this entry silently a no-op on a
# fresh boot. files/etc/modules-load.d/vrf.conf loads the module early
# (systemd-modules-load.service runs before systemd-sysctl.service), so
# this file's setting actually takes effect from boot, before any VRF
# exists. network-config-sync also re-applies the same value at runtime
# after every successful nmstate apply (see config-sync/src/network.rs)
# as a defensive fallback, not as the primary mechanism.
net.vrf.strict_mode = 1
