! Default frr.conf baked into the image.
!
! This is only a safe fallback for the very first boot, before the
! "frr-config" ConfigMap has been mounted and synced into /etc/frr by
! frr-config-sync.service. It intentionally does not configure any
! routing protocol.
frr version 8
frr defaults traditional
hostname frr-bootc
log syslog informational
service integrated-vtysh-config
!
line vty
!
