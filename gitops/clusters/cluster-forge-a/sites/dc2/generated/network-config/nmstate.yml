interfaces:
  # ACI trunk: no IP of its own, every tenant gets a VLAN sub-interface below.
  - name: eth-trunk
    type: ethernet
    state: up

  # Worker BGP-peering network (Layer2 UDN, persistent IP - see
  # base/nad/peering.yaml). Networks tenants advertise are reachable from
  # here; route-rules below steer traffic for them into the right VRF.
  - name: eth-lan
    type: ethernet
    state: up
    ipv4:
      enabled: true
      address:
        - ip: 10.10.2.1
          prefix-length: 24
  # --- initrode (VLAN 100, vrf-initrode) ---
  - name: vrf-initrode
    type: vrf
    state: up
    vrf:
      port:
        - initrode
      route-table-id: 1100
  - name: initrode
    type: vlan
    state: up
    vlan:
      base-iface: eth-trunk
      id: 100
    ipv4:
      enabled: true
      address:
        - ip: 203.0.113.2
          prefix-length: 30
  # --- umbrella (VLAN 101, vrf-umbrella) ---
  - name: vrf-umbrella
    type: vrf
    state: up
    vrf:
      port:
        - umbrella
      route-table-id: 1101
  - name: umbrella
    type: vlan
    state: up
    vlan:
      base-iface: eth-trunk
      id: 101
    ipv4:
      enabled: true
      address:
        - ip: 203.0.113.6
          prefix-length: 30

routes:
  config:
    - destination: 10.21.0.0/24
      next-hop-address: 10.10.2.254
      next-hop-interface: eth-lan
      table-id: 1100
    - destination: 10.21.1.0/24
      next-hop-address: 10.10.2.254
      next-hop-interface: eth-lan
      table-id: 1101

route-rules:
  config:
    # priority must be unique per rule, not just per tenant/table, so it's
    # derived from the table id plus this network's position in the list.
    - ip-from: 10.21.0.0/24
      priority: 11000
      route-table: 1100
    # priority must be unique per rule, not just per tenant/table, so it's
    # derived from the table id plus this network's position in the list.
    - ip-from: 10.21.1.0/24
      priority: 11010
      route-table: 1101
