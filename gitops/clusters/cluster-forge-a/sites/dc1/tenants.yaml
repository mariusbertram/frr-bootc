# Single source of truth for cluster-forge-a/dc1's ACI tenants. Adding
# tenant #4 here and letting CI/ArgoCD sync is the entire "add a tenant"
# runbook - see docs/runbook-add-tenant.md. Nothing here ever requires a VM
# restart (see repo root README.md).
tenants:
  - name: acme
    vlan_id: 100
    vrf: vrf-acme
    local_asn: 65001
    peer_asn: 65000
    local_ip: 198.51.100.2
    prefix_length: 30
    peer_ip: 198.51.100.1
    advertised_networks:
      - 10.20.0.0/24
    import_prefix_lists:
      - {seq: 10, action: permit, prefix: 198.51.100.0/24, le: 32}
    bfd:
      min_rx_ms: 150
      min_tx_ms: 150
      multiplier: 3
    graceful_restart: true

  - name: globex
    vlan_id: 101
    vrf: vrf-globex
    local_asn: 65002
    peer_asn: 65000
    local_ip: 198.51.100.6
    prefix_length: 30
    peer_ip: 198.51.100.5
    advertised_networks:
      - 10.20.1.0/24
    bfd:
      min_rx_ms: 100
      min_tx_ms: 100
      multiplier: 3
    graceful_restart: true

  - name: initech
    vlan_id: 102
    vrf: vrf-initech
    local_asn: 65003
    peer_asn: 65000
    local_ip: 198.51.100.10
    prefix_length: 30
    peer_ip: 198.51.100.9
    advertised_networks:
      - 10.20.2.0/24
      - 10.20.3.0/24
    aggregate_networks:
      - 10.20.2.0/23
    bfd:
      min_rx_ms: 300
      min_tx_ms: 300
      multiplier: 3
    graceful_restart: true
