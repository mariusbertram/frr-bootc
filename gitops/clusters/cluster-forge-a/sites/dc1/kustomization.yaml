# Rendered by ArgoCD as the "path" for the (cluster-forge-a, dc1) Application
# produced by argocd/applicationset-sites.yaml's matrix generator. Combines
# the shared base (NAD/NNCP shape, namespace) with this site's generated
# ConfigMaps/VirtualMachines (see generator/generate.py --site
# clusters/cluster-forge-a/sites/dc1, which must be re-run - and its output
# committed - whenever tenants.yaml/values.yaml changes; there is no
# in-cluster rendering step).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: frr-bootc

resources:
  - ../../../../base
  - generated/virtualmachines/virtualmachines.yaml

# disableNameSuffixHash is required, not optional: the whole point of the
# frr-bootc sync mechanism is that "frr-config"/"network-config" keep a
# FIXED name and get updated in place (picked up live by inotify inside the
# guest, see repo root README.md) - kustomize's default content-hash suffix
# would instead mint a new ConfigMap name on every tenant change, which
# nothing here is set up to roll onto the VM (VirtualMachine objects aren't
# Deployments; kustomize's automatic name-reference fixup doesn't cover
# KubeVirt's spec.volumes[].configMap.name either).
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: frr-config
    files:
      - generated/frr-config/daemons
      - generated/frr-config/frr.conf
      - generated/frr-config/vtysh.conf
  - name: network-config
    files:
      - generated/network-config/interfaces.yaml
      - generated/network-config/nmstate.yml

patches:
  # Site-specific node placement for the NNCP objects from base/.
  - target:
      kind: NodeNetworkConfigurationPolicy
      name: trunk-br0-policy
    patch: |-
      - op: replace
        path: /spec/nodeSelector/frr-bootc.io~1site
        value: dc1
  - target:
      kind: NodeNetworkConfigurationPolicy
      name: frr-peering-uplink-policy
    patch: |-
      - op: replace
        path: /spec/nodeSelector/frr-bootc.io~1site
        value: dc1
  # Peering subnet must match this site's eth-lan network
  # (see values.yaml networks.lan) - the OVN-K Layer2 UDN is scoped per site.
  - target:
      kind: NetworkAttachmentDefinition
      name: frr-peering
    patch: |-
      - op: replace
        path: /spec/config
        value: |
          {
            "cniVersion": "0.4.0",
            "name": "frr-peering",
            "type": "ovn-k8s-cni-overlay",
            "topology": "layer2",
            "subnets": "10.10.1.0/24",
            "mtu": 1500,
            "netAttachDefName": "frr-bootc/frr-peering",
            "allowPersistentIPs": true
          }

labels:
  - includeSelectors: false
    pairs:
      frr-bootc.io/cluster: cluster-forge-a
      frr-bootc.io/site: dc1
