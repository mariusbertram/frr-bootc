# cluster-forge-a: production Forge-Verbund cluster, two datacenters,
# manual promotion (syncPolicy: manual - see argocd/applicationset-sites.yaml).
cluster:
  name: cluster-forge-a
  asn_range:
    min: 65000
    max: 65099
  default_image: registry.example.com/frr-bootc/frr-bootc-containerdisk:v1.4.0
  default_replicas: 2
  default_resources:
    cores: 8
    memory: 16Gi
    hugepage_size: 1Gi
  sync_policy: manual
