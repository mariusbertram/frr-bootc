# Cluster-scoped resources: rendered by ArgoCD as the path for the
# cluster-forge-a Application produced by
# argocd/applicationset-cluster-infra.yaml (cluster generator only, no site
# matrix - HyperConverged is a cluster-wide singleton, applying it once per
# site would just mean N Applications fighting over the same object).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/cluster-infra

patches:
  - target:
      kind: NodeNetworkConfigurationPolicy
      name: migration-uplink-policy
    patch: |-
      - op: replace
        path: /spec/nodeSelector/frr-bootc.io~1cluster
        value: cluster-forge-a

labels:
  - includeSelectors: false
    pairs:
      frr-bootc.io/cluster: cluster-forge-a
