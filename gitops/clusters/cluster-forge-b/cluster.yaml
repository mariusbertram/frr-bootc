# cluster-forge-b: smaller/staging Forge-Verbund cluster, one datacenter,
# automated self-heal (syncPolicy: automated - see
# argocd/applicationset-sites.yaml) so new FRR image versions land here
# first before being promoted to cluster-forge-a.
cluster:
  name: cluster-forge-b
  asn_range:
    min: 65100
    max: 65149
  default_image: registry.example.com/frr-bootc/frr-bootc-containerdisk:v1.5.0-rc1
  default_replicas: 1
  default_resources:
    cores: 4
    memory: 8Gi
    hugepage_size: 1Gi
  sync_policy: automated
