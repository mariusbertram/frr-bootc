# Shared base: things every site needs, in shape but not in concrete value.
# Concrete values (bridge names, node selectors, subnets, VLAN ranges) are
# supplied per site via clusters/<cluster>/sites/<site>/kustomization.yaml
# patches. VirtualMachine and the frr-config/network-config ConfigMaps are
# deliberately NOT listed here - they are generated per site by
# generator/generate.py from tenants.yaml/values.yaml (see
# clusters/<cluster>/sites/<site>/generated/), not templated by Kustomize.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - nad/trunk.yaml
  - nad/peering.yaml
  - nncp/trunk-uplink.yaml
  - nncp/peering-uplink.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: frr-bootc
      app.kubernetes.io/managed-by: argocd
