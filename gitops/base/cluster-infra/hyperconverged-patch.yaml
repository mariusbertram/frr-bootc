# Patch-only resource (see clusters/<cluster>/cluster-infra/kustomization.yaml):
# targets the cluster's existing HyperConverged singleton, it is not created
# here. Applied once per cluster (not per site) since it's a cluster-wide
# object - see argocd/applicationset-cluster-infra.yaml, which uses the
# cluster generator alone (no site matrix) for exactly this reason.
#
# - featureGates: virtiofs is required for the frr-config/network-config
#   ConfigMap-as-filesystem mount (see repo root README.md).
# - liveMigrationConfig.network: routes migration traffic over the dedicated
#   network from ./migration-nad.yaml instead of the pod network.
apiVersion: hco.kubevirt.io/v1beta1
kind: HyperConverged
metadata:
  name: kubevirt-hyperconverged
  namespace: openshift-cnv
spec:
  featureGates:
    persistentReservation: false
  liveMigrationConfig:
    network: migration
    completionTimeoutPerGiB: 800
    parallelMigrationsPerCluster: 5
    parallelOutboundMigrationsPerNode: 2
