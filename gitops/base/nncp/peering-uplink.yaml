# Host-side attachment of OpenShift workers to the "frr-peering" Layer2
# secondary network (base/nad/peering.yaml): the worker's own BGP speaker
# (hostNetwork, e.g. an FRR/BGP daemon run as a DaemonSet Pod, or a
# BGP-capable CNI feature) needs a host interface on this segment to peer
# with the FRR VMs and advertise Service IPs. "eno3" and the node selector
# are placeholders patched per site; this is normally a plain access port -
# no VLAN tagging inside this segment.
apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: frr-peering-uplink-policy
spec:
  nodeSelector:
    frr-bootc.io/site: REPLACE_WITH_SITE
  desiredState:
    interfaces:
      - name: peer-br0
        type: linux-bridge
        state: up
        bridge:
          options:
            stp:
              enabled: false
          port:
            - name: eno3
