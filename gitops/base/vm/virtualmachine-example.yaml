# Illustrative, fully-commented example of ONE FRR-VM replica, showing every
# network interface and every high-throughput/redundancy knob described in
# docs/architecture.md. This file is NOT wired into any kustomization - the
# actual per-site VMs are rendered by generator/generate.py from
# clusters/<cluster>/sites/<site>/values.yaml (see
# generator/templates/virtualmachine.yaml.j2, which mirrors this file almost
# 1:1) so that "n replicas per site/cluster" stays data-driven instead of
# hand-copied. Look here first to understand the shape; look at
# generator/templates/virtualmachine.yaml.j2 to understand how it's stamped
# out N times.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: frr-bootc-dc1-0
  namespace: frr-bootc
  labels:
    app.kubernetes.io/name: frr-bootc
    frr-bootc.io/site: dc1
    frr-bootc.io/instance: "0"
spec:
  running: true
  template:
    metadata:
      labels:
        kubevirt.io/domain: frr-bootc-dc1-0
        app.kubernetes.io/name: frr-bootc
        frr-bootc.io/site: dc1
        frr-bootc.io/instance: "0"
    spec:
      # Redundancy: hard anti-affinity against every other FRR-VM replica of
      # this site, spread across nodes. Combined with the site's nodeSelector
      # (nodes are labelled per datacenter), this gives the
      # "über Nodes/Datacenter verteilt" redundancy the architecture calls
      # for - one Application per (cluster, site) via the ApplicationSet
      # matrix (see ../../argocd/applicationset-sites.yaml) means replicas
      # never straddle sites by accident.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: ["frr-bootc"]
                  - key: frr-bootc.io/site
                    operator: In
                    values: ["dc1"]
              topologyKey: kubernetes.io/hostname
      nodeSelector:
        frr-bootc.io/site: dc1
      # Long grace period: gives bgpd time to run BGP graceful-shutdown
      # (lower local-pref, withdraw) across all tenant VRFs before the
      # domain actually stops - the closest KubeVirt equivalent of a Pod
      # preStop hook, implemented as a systemd ExecStop in the frr-bootc
      # image rather than here. BFD (100-300ms detection, configured per
      # neighbor in frr-config) covers the unplanned-failure case; this
      # covers planned maintenance.
      terminationGracePeriodSeconds: 180
      evictionStrategy: LiveMigrate
      domain:
        cpu:
          cores: 8
          # Pins vCPUs to host CPUs 1:1 - required for the ~100Gbit/s mostly-
          # HTTP transit profile; needs a matching isolated-CPU pool on the
          # nodes (out of this repo's scope, see docs/architecture.md).
          dedicatedCpuPlacement: true
        memory:
          guest: 16Gi
          hugepages:
            pageSize: 1Gi
        devices:
          networkInterfaceMultiqueue: true
          disks:
            - name: containerdisk
              disk:
                bus: virtio
          interfaces:
            # Management only, never carries tenant or peering traffic.
            - name: default
              masquerade: {}
            # ACI VLAN trunk - one dedicated physical NIC via base/nad/trunk.yaml,
            # never br-ex/OVN. Same MAC-pinning contract as the frr-bootc
            # image's frr-bootc-ifnaming.service expects (see repo root
            # README.md, "Adding a New Physical Interface Reliably").
            - name: eth-trunk
              macAddress: "02:00:00:d1:00:00"
              bridge: {}
            # Worker BGP-peering network - Layer2 UDN with persistent IPs
            # (base/nad/peering.yaml), so this MAC/IP survives live migration.
            - name: eth-lan
              macAddress: "02:00:00:d1:00:01"
              bridge: {}
          # frr-config and network-config are handed to the guest as plain
          # files via virtiofs (not a disk image, no reboot needed to pick up
          # changes) - see repo root README.md for the full sync mechanism.
          filesystems:
            - name: frr-config
              virtiofs: {}
            - name: network-config
              virtiofs: {}
      networks:
        - name: default
          pod: {}
        - name: eth-trunk
          multus:
            networkName: trunk
        - name: eth-lan
          multus:
            networkName: frr-peering
      # NOTE: the live-migration network is intentionally NOT listed here.
      # It is a cluster-wide KubeVirt setting
      # (HyperConverged.spec.liveMigrationConfig.network, see
      # base/cluster-infra/hyperconverged-patch.yaml) that
      # virt-handler uses automatically for migration traffic on every VM in
      # the cluster - it is not a per-VM interface (see
      # clusters/<cluster>/cluster-infra/kustomization.yaml).
      volumes:
        - name: containerdisk
          containerDisk:
            image: <registry>/frr-bootc-containerdisk:v1.4.0
        - name: frr-config
          configMap:
            name: frr-config
        - name: network-config
          configMap:
            name: network-config
