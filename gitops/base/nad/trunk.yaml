# ACI VLAN trunk NAD - one dedicated physical NIC per FRR VM, deliberately
# NOT shared with OVN/br-ex. No "vlan" field: the bridge CNI plugin only
# applies single-VLAN access-port tagging when "vlan" is set, so omitting it
# makes the VM's tap interface a trunk port that passes every 802.1Q-tagged
# frame through untouched. Tenants get a VLAN sub-interface inside the guest
# (nmstate), never their own NAD/interface - see ../../generator and
# ../../docs/architecture.md ("VRF isolation").
#
# "trunk-br0" is a placeholder bridge name - each site overlay patches
# ".spec.config" (via a JSON/SMP patch) to point at that datacenter's actual
# node-side bridge, which must be created out-of-band with
# `vlan_filtering: true` and the physical uplink NIC as a trunk port for the
# tenant VLAN range (see base/nncp/trunk-uplink.yaml).
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: trunk
  namespace: frr-bootc
spec:
  config: |
    {
      "cniVersion": "0.4.0",
      "name": "trunk",
      "type": "bridge",
      "bridge": "trunk-br0",
      "macspoofchk": false,
      "ipam": {}
    }
