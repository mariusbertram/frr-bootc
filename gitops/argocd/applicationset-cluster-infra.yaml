# One Application per cluster (no site matrix - HyperConverged is a
# cluster-wide singleton, see clusters/<cluster>/cluster-infra/). Uses the
# cluster generator alone, not the matrix from applicationset-sites.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: frr-border-cluster-infra
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            frr-bootc.io/enabled: "true"
        values:
          clusterName: "{{ .name }}"
          syncPolicy: '{{ index .metadata.labels "frr-bootc.io/sync-policy" }}'
  template:
    metadata:
      name: "frr-border-{{ .values.clusterName }}-cluster-infra"
      labels:
        frr-bootc.io/cluster: "{{ .values.clusterName }}"
    spec:
      project: frr-bootc
      source:
        repoURL: https://github.com/mariusbertram/frr-bootc.git
        targetRevision: HEAD
        path: "gitops/clusters/{{ .values.clusterName }}/cluster-infra"
      destination:
        name: "{{ .values.clusterName }}"
        namespace: openshift-cnv
      syncPolicy:
        {{- if eq .values.syncPolicy "automated" }}
        automated:
          selfHeal: true
          prune: false # never auto-prune the HyperConverged singleton
        {{- end }}
