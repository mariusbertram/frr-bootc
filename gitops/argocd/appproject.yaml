apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: frr-bootc
  namespace: openshift-gitops
spec:
  description: FRR border-leaf VM fleet across all registered Forge-Verbund clusters
  sourceRepos:
    - https://github.com/mariusbertram/frr-bootc.git
  destinations:
    # Namespace itself is created by base/namespace.yaml, not this project.
    - namespace: frr-bootc
      server: "*"
    - namespace: openshift-cnv
      server: "*"
  clusterResourceWhitelist:
    - group: hco.kubevirt.io
      kind: HyperConverged
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
