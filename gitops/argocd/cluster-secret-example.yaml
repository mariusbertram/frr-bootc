# How to register a target cluster with the central ArgoCD instance so the
# ApplicationSets in this directory pick it up automatically (see
# docs/runbook-add-cluster.md for the full procedure, including
# `argocd cluster add`, which generates most of this Secret for you - the
# labels below are the part you still add by hand).
#
# - "argocd.argoproj.io/secret-type: cluster" is what makes this a cluster
#   Secret at all.
# - "frr-bootc.io/enabled: true" is the opt-in switch both ApplicationSets'
#   cluster generator selectors require - a cluster registered with ArgoCD
#   for other purposes is NOT touched by this repo unless this label is set.
# - "frr-bootc.io/sync-policy" mirrors clusters/<cluster>/cluster.yaml's
#   "sync_policy" field into something the ApplicationSet template's Go
#   template can read (ApplicationSet generators cannot read arbitrary repo
#   files, only what the cluster Secret/git generator expose) - keep both in
#   sync by convention, there is no automatic check tying them together.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-forge-a
  namespace: openshift-gitops
  labels:
    argocd.argoproj.io/secret-type: cluster
    frr-bootc.io/enabled: "true"
    frr-bootc.io/sync-policy: manual
type: Opaque
stringData:
  name: cluster-forge-a
  server: https://api.forge-a.example.com:6443
  config: |
    {
      "bearerToken": "<redacted - see docs/runbook-add-cluster.md>",
      "tlsClientConfig": {
        "insecure": false,
        "caData": "<redacted, base64>"
      }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: cluster-forge-b
  namespace: openshift-gitops
  labels:
    argocd.argoproj.io/secret-type: cluster
    frr-bootc.io/enabled: "true"
    frr-bootc.io/sync-policy: automated
type: Opaque
stringData:
  name: cluster-forge-b
  server: https://api.forge-b.example.com:6443
  config: |
    {
      "bearerToken": "<redacted - see docs/runbook-add-cluster.md>",
