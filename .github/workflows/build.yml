name: Build OCI image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Fast feedback on this repo's Rust crates, ahead of and independent
  # from the full container build below: `cargo build` inside the
  # Containerfile's builder stages only proves each crate compiles, not
  # that it's linted or its tests pass, and waiting on a full image build
  # just to see a clippy warning is a bad loop. One job per crate (not a
  # matrix) so each keeps its own stable check name.
  console-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry/build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: console

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: cargo build --release
        run: cargo build --release --locked

  # frr-vty is a path dependency of both config-sync and console (see its
  # own Cargo.toml comments) - checked out out here.
  frr-vty-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frr-vty
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry/build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frr-vty

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

  config-sync-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: config-sync
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry/build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: config-sync

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: cargo build --release
        run: cargo build --release --locked

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Converts the bootc image just pushed above into a qcow2 disk (via
  # bootc-image-builder) and publishes it wrapped as a containerDisk image -
  # the format KubeVirt/OpenShift Virtualization needs, whether it's
  # referenced directly as spec...volumes[].containerDisk.image (see
  # manifests/30-virtualmachine.yaml) or imported into a PVC via a CDI
  # DataVolume/DataImportCron with a "registry" source (see
  # manifests/25-dataimportcron.yaml). Skipped on pull requests, same as
  # the push step above - see build.sh for the equivalent local workflow.
  containerdisk:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Based on Red Hat's own reference invocation
      # (https://developers.redhat.com/articles/2024/11/11/deploy-image-mode-rhel-openshift-virtualization),
      # using podman like build.sh does locally: current bootc-image-builder
      # versions no longer pull the image themselves ("bootc-image-builder
      # no longer pulls images, make sure to pull it before running
      # bootc-image-builder") and inspect it from the podman storage
      # bind-mounted at /var/lib/containers/storage, so it has to already be
      # there - hence the explicit "podman pull" below (--local is the
      # default now, no flag needed). Needs real root (loop devices, mount
      # namespaces), which is why this uses sudo even with --privileged,
      # same as build.sh.
      - name: Pull the bootc image into podman's local storage
        run: |
          sudo podman pull "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}"

      # Fedora bootc images (unlike RHEL/CentOS Stream bootc) don't declare
      # a default root filesystem type, so --rootfs is required or
      # bootc-image-builder fails with "missing required info: DefaultRootFs".
      - name: Convert bootc image to a qcow2 disk with bootc-image-builder
        run: |
          mkdir -p output
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v "$(pwd)/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 \
            --rootfs xfs \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}"
          sudo chown -R "$(id -u):$(id -g)" output

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract containerDisk image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-containerdisk
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push containerDisk image
        uses: docker/build-push-action@v6
        with:
          context: output
          file: containerdisk/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
