name: GitOps CI

on:
  push:
    branches: [main]
    paths: ["gitops/**"]
  pull_request:
    branches: [main]
    paths: ["gitops/**"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python tooling
        run: pip install --no-cache-dir -r gitops/ci/requirements.txt

      - name: Regenerate and diff against committed output
        # generator/generate.py's output (clusters/*/sites/*/generated/) is
        # committed - CI fails if someone edited tenants.yaml/values.yaml
        # without re-running the generator and committing the result, since
        # ArgoCD only ever reads the committed generated/ files, never runs
        # the generator itself.
        run: |
          python3 gitops/generator/generate.py --all
          git diff --exit-code -- gitops/clusters '*/generated/*' || {
            echo "::error::generated/ is stale - run generator/generate.py --all and commit the result";
            exit 1;
          }

      - name: Cross-cluster validation (ASN/prefix overlap, schema)
        # vtysh isn't on this runner's PATH, so this step's own frr.conf
        # syntax check no-ops with a warning - the real vtysh -C check runs
        # against the committed frr.conf files in the next step, inside the
        # actual frrouting/frr image.
        run: python3 gitops/ci/validate.py

      - name: frr.conf syntax check (vtysh -C, real FRR parser)
        # Same command frr-config-sync runs inside the frr-bootc image on
        # every config change (see files/usr/local/bin/frr-config-sync) -
        # run via `docker run` against the quay.io/frrouting/frr image
        # rather than as the job's container, since that image isn't
        # Debian/Ubuntu-based and has no apt-get for the Python step above.
        run: |
          set -euo pipefail
          for f in gitops/clusters/*/sites/*/generated/frr-config/frr.conf; do
            echo "== $f =="
            docker run --rm -v "$PWD:/repo:ro" -w /repo \
              quay.io/frrouting/frr:9.1.0 vtysh -f "$f" -C
          done

      - name: Install kustomize
        run: |
          curl -sSL -o /tmp/kustomize.tgz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz"
          tar -C /usr/local/bin -xzf /tmp/kustomize.tgz kustomize

      - name: kustomize build every cluster/site
        run: |
          set -euo pipefail
          for d in gitops/clusters/*/sites/* gitops/clusters/*/cluster-infra; do
            echo "== $d =="
            kustomize build "$d" > /dev/null
          done
