# Consumed by frr-config-sync.service inside the VM (mounted read-only at
# /run/config/frr via virtiofs). Edit this ConfigMap and frr-config-sync.path
# picks up the change automatically - no VM restart needed for frr.conf
# changes (a change to "daemons" restarts frr.service, everything else is
# applied with a live "vtysh"/frr-reload.py reload).
apiVersion: v1
kind: ConfigMap
metadata:
  name: frr-config
  namespace: frr-bootc
data:
  daemons: |
    zebra=yes
    bgpd=yes
    ospfd=no
    ospf6d=no
    ripd=no
    ripngd=no
    isisd=no
    pimd=no
    pim6d=no
    ldpd=no
    nhrpd=no
    eigrpd=no
    babeld=no
    sharpd=no
    pbrd=yes
    staticd=yes
    bfdd=no
    fabricd=no
    vrrpd=no
    pathd=no
    mgmtd=yes

    vtysh_enable=yes
    zebra_options="   -A 127.0.0.1 -s 90000000"
    mgmtd_options="   -A 127.0.0.1"
    bgpd_options="    -A 127.0.0.1"
    staticd_options=" -A 127.0.0.1"
    pbrd_options="    -A 127.0.0.1"

  frr.conf: |
    frr version 8
    frr defaults traditional
    hostname frr-bootc-example
    log syslog informational
    service integrated-vtysh-config
    !
    ! Each uplink runs its own BGP instance inside its own VRF (the VRF
    ! itself, and the enslavement of eth-uplink1/eth-uplink2 into it, is
    ! configured via network-config's nmstate.yml).
    router bgp 65001 vrf vrf-uplink1
     bgp router-id 198.51.100.2
     neighbor 198.51.100.1 remote-as 65000
     !
     address-family ipv4 unicast
      network 10.0.0.0/24
     exit-address-family
    !
    router bgp 65002 vrf vrf-uplink2
     bgp router-id 203.0.113.2
     neighbor 203.0.113.1 remote-as 65100
     !
     address-family ipv4 unicast
      network 10.0.1.0/24
     exit-address-family
    !
    ! Each uplink VRF needs a route to the network it advertises, or the
    ! "network" statements above have nothing to advertise. The actual next
    ! hop is further inside the LAN, reachable via eth-lan in the default VRF.
    vrf vrf-uplink1
     ip route 10.0.0.0/24 10.0.2.254 nexthop-vrf default
    exit-vrf
    !
    vrf vrf-uplink2
     ip route 10.0.1.0/24 10.0.2.254 nexthop-vrf default
    exit-vrf
    !
    ! PBR: traffic sourced from a network that is advertised over a given
    ! uplink's BGP session is forwarded using that uplink's VRF, regardless
    ! of which VRF it physically arrives in (here: the default VRF, via
    ! eth-lan).
    pbr-map PBR-LAN seq 10
     match src-ip 10.0.0.0/24
     set vrf vrf-uplink1
    !
    pbr-map PBR-LAN seq 20
     match src-ip 10.0.1.0/24
     set vrf vrf-uplink2
    !
    interface eth-lan
     pbr-map PBR-LAN
    !
    line vty
    !

  vtysh.conf: |
    service integrated-vtysh-config
