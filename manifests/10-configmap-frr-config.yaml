# Consumed by frr-config-sync.service inside the VM (mounted read-only at
# /run/config/frr via virtiofs). Edit this ConfigMap and frr-config-sync.path
# picks up the change automatically - no VM restart needed for frr.conf
# changes (a change to "daemons" restarts frr.service, everything else is
# applied with a live "vtysh"/frr-reload.py reload).
apiVersion: v1
kind: ConfigMap
metadata:
  name: frr-config
  namespace: frr-bootc
data:
  daemons: |
    zebra=yes
    bgpd=yes
    ospfd=no
    ospf6d=no
    ripd=no
    ripngd=no
    isisd=no
    pimd=no
    pim6d=no
    ldpd=no
    nhrpd=no
    eigrpd=no
    babeld=no
    sharpd=no
    pbrd=no
    staticd=yes
    bfdd=no
    fabricd=no
    vrrpd=no
    pathd=no
    mgmtd=yes

    vtysh_enable=yes
    zebra_options="   -A 127.0.0.1 -s 90000000"
    mgmtd_options="   -A 127.0.0.1"
    bgpd_options="    -A 127.0.0.1"
    staticd_options=" -A 127.0.0.1"

  frr.conf: |
    frr version 8
    frr defaults traditional
    hostname frr-bootc-example
    log syslog informational
    service integrated-vtysh-config
    !
    ! Each uplink runs its own BGP instance inside its own VRF. The VRF
    ! itself, the enslavement of eth-uplink1/eth-uplink2 into it, the route
    ! each VRF needs to have something to advertise, and the PBR that
    ! steers matching traffic into the right VRF are all configured
    ! declaratively via network-config's nmstate.yml (interfaces/routes/
    ! route-rules) - see the "VRF pro Interface und Policy-Based Routing"
    ! section of README.md.
    router bgp 65001 vrf vrf-uplink1
     bgp router-id 198.51.100.2
     neighbor 198.51.100.1 remote-as 65000
     !
     address-family ipv4 unicast
      network 10.0.0.0/24
     exit-address-family
    !
    router bgp 65002 vrf vrf-uplink2
     bgp router-id 203.0.113.2
     neighbor 203.0.113.1 remote-as 65100
     !
     address-family ipv4 unicast
      network 10.0.1.0/24
     exit-address-family
    !
    line vty
    !

  vtysh.conf: |
    service integrated-vtysh-config
