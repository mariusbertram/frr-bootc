# Consumed by frr-config-sync.service inside the VM (mounted read-only at
# /run/config/frr via virtiofs). Edit this ConfigMap and frr-config-sync.path
# picks up the change automatically - no VM restart needed for frr.conf
# changes (a change to "daemons" restarts frr.service, everything else is
# applied with a live "vtysh"/frr-reload.py reload).
apiVersion: v1
kind: ConfigMap
metadata:
  name: frr-config
  namespace: frr-bootc
data:
  daemons: |
    zebra=yes
    bgpd=yes
    ospfd=no
    ospf6d=no
    ripd=no
    ripngd=no
    isisd=no
    pimd=no
    pim6d=no
    ldpd=no
    nhrpd=no
    eigrpd=no
    babeld=no
    sharpd=no
    pbrd=no
    staticd=yes
    bfdd=yes
    fabricd=no
    vrrpd=no
    pathd=no
    mgmtd=yes

    vtysh_enable=yes
    zebra_options="   -A 127.0.0.1 -s 90000000"
    mgmtd_options="   -A 127.0.0.1"
    bgpd_options="    -A 127.0.0.1"
    staticd_options=" -A 127.0.0.1"
    bfdd_options="    -A 127.0.0.1"

  frr.conf: |
    frr version 8
    frr defaults traditional
    hostname frr-bootc-example
    log syslog informational
    service integrated-vtysh-config
    !
    ! Each tenant runs its own BGP instance inside its own VRF, with BFD
    ! for fast failure detection. The VRF itself, the tenant's VLAN
    ! sub-interface and its enslavement into that VRF, the route the VRF
    ! needs to have something to advertise, and the PBR that steers
    ! matching traffic into the right VRF are all configured declaratively
    ! via network-config's nmstate.yml (interfaces/routes/route-rules) -
    ! see the "VRF per Tenant and Policy-Based Routing" and "Adding
    ! Tenants Without a VM Restart" sections of README.md.
    ! IPv6 peering is entirely optional per tenant: tenant1 here peers
    ! dual-stack (IPv4 + IPv6), tenant2 below stays IPv4-only. An IPv6
    ! neighbor is just another "neighbor <address> remote-as ..." line -
    ! FRR auto-activates it under "address-family ipv6 unicast" because
    ! its address is an IPv6 one, exactly like the IPv4 neighbor is
    ! auto-activated under "address-family ipv4 unicast". "bgp router-id"
    ! stays an IPv4-form value either way, per the BGP spec. The matching
    ! IPv6 address (nmstate's "ipv6:" block), leaked route and route-rule
    ! live in network-config's nmstate.yml - see the "Optional IPv6 BGP
    ! Peering" section of README.md.
    router bgp 65001 vrf vrf-tenant1
     bgp router-id 198.51.100.2
     neighbor 198.51.100.1 remote-as 65000
     neighbor 198.51.100.1 bfd
     neighbor 2001:db8:100::1 remote-as 65000
     neighbor 2001:db8:100::1 bfd
     !
     address-family ipv4 unicast
      network 10.0.0.0/24
     exit-address-family
     !
     address-family ipv6 unicast
      network 2001:db8:a::/64
     exit-address-family
    !
    router bgp 65002 vrf vrf-tenant2
     bgp router-id 203.0.113.2
     neighbor 203.0.113.1 remote-as 65100
     neighbor 203.0.113.1 bfd
     !
     address-family ipv4 unicast
      network 10.0.1.0/24
     exit-address-family
    !
    line vty
    !

  vtysh.conf: |
    service integrated-vtysh-config
