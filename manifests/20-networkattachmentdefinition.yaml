# Example Multus secondary network for the shared VLAN trunk - the VM's
# only additional interface, using the Linux bridge CNI plugin.
#
# Deliberately no "vlan" field: the bridge CNI plugin only applies
# single-VLAN access-port tagging/untagging when "vlan" is set, so leaving
# it out makes the VM's tap interface a trunk port that passes every
# 802.1Q-tagged frame through untouched. Every logical network inside the
# guest - each tenant's VLAN, and the non-tenant "eth-lan" default-VRF
# network - is a VLAN sub-interface added/removed entirely via
# network-config's nmstate.yml, never a NAD or VM change. This requires the
# node-side bridge "trunk-br0" to actually be a VLAN-aware trunk itself
# (`vlan_filtering: true`, with the physical uplink NIC configured as a
# trunk port carrying every VLAN ID you plan to hand out, tenant or not) -
# configure that via NMState's NodeNetworkConfigurationPolicy.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: trunk
  namespace: frr-bootc
spec:
  config: |
    {
      "cniVersion": "0.4.0",
      "name": "trunk",
      "type": "bridge",
      "bridge": "trunk-br0",
      "macspoofchk": false,
      "ipam": {}
    }
