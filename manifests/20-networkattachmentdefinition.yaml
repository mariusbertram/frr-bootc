# Example Multus secondary network for a physical uplink. Adjust
# "bridge"/NNCP setup to your actual OpenShift node networking; this assumes
# a Linux bridge named "uplink1-br0" has already been configured on the
# nodes (e.g. via NMState's NodeNetworkConfigurationPolicy) and attached to
# a physical NIC.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: uplink1
  namespace: frr-bootc
spec:
  config: |
    {
      "cniVersion": "0.4.0",
      "name": "uplink1",
      "type": "bridge",
      "bridge": "uplink1-br0",
      "macspoofchk": false,
      "ipam": {}
    }
