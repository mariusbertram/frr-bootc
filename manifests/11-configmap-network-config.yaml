# Consumed by frr-bootc-ifnaming.service and network-config-sync.service
# inside the VM (mounted read-only at /run/config/network via virtiofs).
#
# - interfaces.yaml pins MAC addresses to interface names, but only for
#   interfaces KubeVirt actually presents to the guest as PCI/virtio
#   devices (here: eth-trunk, eth-lan). Keep it in lockstep with the
#   macAddress/name pairs used in the VirtualMachine's
#   spec.domain.devices.interfaces (see 30-virtualmachine.yaml). Per-tenant
#   VLAN sub-interfaces below are pure software constructs created by
#   nmstate itself (explicit `name:`), so they need no MAC pinning.
# - nmstate.yml is an ordinary nmstate desired-state document, applied with
#   `nmstatectl apply`. Every tenant gets a VLAN sub-interface on the
#   shared "eth-trunk" NIC, enslaved into its own VRF (see the "Tenants
#   ohne VM-Neustart hinzufügen" section of README.md); frr-config's
#   frr.conf runs a per-tenant BGP instance in that VRF, and nmstate's own
#   route-rules do the PBR that steers the networks each instance
#   advertises into that VRF - a flat, source-prefix-based rule that scales
#   to many tenants far better than binding an FRR pbr-map to one fixed
#   ingress interface.
#
# NetworkManager keyfiles can be used instead of/alongside nmstate by adding
# a "*.nmconnection" key here - network-config-sync installs those directly
# into /etc/NetworkManager/system-connections/.
apiVersion: v1
kind: ConfigMap
metadata:
  name: network-config
  namespace: frr-bootc
data:
  interfaces.yaml: |
    interfaces:
      - mac: "02:00:00:12:34:01"
        name: eth-trunk
      - mac: "02:00:00:12:34:02"
        name: eth-lan

  nmstate.yml: |
    interfaces:
      # Trunk NIC carrying one 802.1Q-tagged VLAN per tenant (see
      # 20-networkattachmentdefinition.yaml). No IP of its own - every
      # tenant gets its own VLAN sub-interface below. Adding tenant #151
      # only ever touches this ConfigMap, never the VM spec or this NIC.
      - name: eth-trunk
        type: ethernet
        state: up

      # --- Tenant 1 -----------------------------------------------------
      - name: vrf-tenant1
        type: vrf
        state: up
        vrf:
          port:
            - tenant1
          route-table-id: 1001
      - name: tenant1
        type: vlan
        state: up
        vlan:
          base-iface: eth-trunk
          id: 100
        ipv4:
          enabled: true
          address:
            - ip: 198.51.100.2
              prefix-length: 30

      # --- Tenant 2 -----------------------------------------------------
      - name: vrf-tenant2
        type: vrf
        state: up
        vrf:
          port:
            - tenant2
          route-table-id: 1002
      - name: tenant2
        type: vlan
        state: down
        vlan:
          base-iface: eth-trunk
          id: 200
        ipv4:
          enabled: true
          address:
            - ip: 203.0.113.2
              prefix-length: 30

      # Internal-facing interface, stays in the default VRF. This is where
      # the networks advertised by each tenant's BGP session are actually
      # reachable from; route-rules below steer traffic for them into the
      # matching tenant VRF no matter where it originates.
      - name: eth-lan
        type: ethernet
        state: up
        ipv4:
          enabled: true
          address:
            - ip: 10.0.2.1
              prefix-length: 24

    routes:
      config:
        # Gives each tenant VRF's BGP "network" statement (in frr-config's
        # frr.conf) a route to actually advertise. One entry per tenant,
        # pointing at wherever that tenant's network is reachable from
        # (here: further inside the LAN, via eth-lan).
        - destination: 10.0.0.0/24
          next-hop-address: 10.0.2.254
          next-hop-interface: eth-lan
          table-id: 1001
        - destination: 10.0.1.0/24
          next-hop-address: 10.0.2.254
          next-hop-interface: eth-lan
          table-id: 1002

    route-rules:
      config:
        # PBR: traffic sourced from a network that is advertised over a
        # given tenant's BGP session is forwarded using that tenant's VRF
        # routing table - regardless of which interface/VRF it physically
        # arrives on. This is a flat list, so it scales to many tenants:
        # each one just adds one more VLAN+VRF interface pair + routes
        # entry + route-rules entry with its own VLAN id, route-table id
        # and priority (a ConfigMap for ~150 tenants would typically be
        # generated rather than hand-written, but the format itself
        # doesn't change, and none of it needs a VM restart).
        - ip-from: 10.0.0.0/24
          priority: 1000
          route-table: 1001
        - ip-from: 10.0.1.0/24
          priority: 1010
          route-table: 1002
