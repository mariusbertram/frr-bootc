# Consumed by network-config-sync.service inside the VM (mounted read-only
# at /run/config/network via virtiofs).
#
# nmstate.yml is an ordinary nmstate desired-state document, applied with
# `nmstatectl apply`. Every tenant gets a VLAN sub-interface on the shared
# "eth-trunk" NIC, enslaved into its own VRF (see the "Adding Tenants
# Without a VM Restart" section of README.md); frr-config's frr.conf runs a
# per-tenant BGP instance in that VRF, and nmstate's own route-rules do the
# PBR that steers the networks each instance advertises into that VRF - a
# flat, source-prefix-based rule that scales to many tenants far better
# than binding an FRR pbr-map to one fixed ingress interface.
#
# "eth-trunk" is identified below by the same fixed macAddress set on it
# in the VirtualMachine spec (30-virtualmachine.yaml) - nmstate renames it
# to "eth-trunk" itself as part of this apply, no udev/.link file/
# initramfs involved.
#
# NetworkManager keyfiles can be used instead of/alongside nmstate by adding
# a "*.nmconnection" key here - network-config-sync installs those directly
# into /etc/NetworkManager/system-connections/.
apiVersion: v1
kind: ConfigMap
metadata:
  name: network-config
  namespace: frr-bootc
data:
  nmstate.yml: |
    interfaces:
      # Trunk NIC carrying one 802.1Q-tagged VLAN per tenant, plus the
      # non-tenant "eth-lan" VLAN below (see
      # 20-networkattachmentdefinition.yaml). No IP of its own - every
      # logical network gets its own VLAN sub-interface below. Adding
      # tenant #151 only ever touches this ConfigMap, never the VM spec or
      # this NIC. Must match the macAddress set in the VirtualMachine spec.
      - name: eth-trunk
        identifier: mac-address
        mac-address: "02:00:00:00:00:01"
        type: ethernet
        state: up

      # --- Tenant 1 -----------------------------------------------------
      # Dual-stack: this tenant peers over both IPv4 and IPv6 (see
      # frr-config's frr.conf and the "Optional IPv6 BGP Peering" section
      # of README.md). IPv6 is entirely optional per tenant - tenant2
      # below has no "ipv6:" block at all and stays IPv4-only.
      - name: vrf-tenant1
        type: vrf
        state: up
        vrf:
          port:
            - tenant1
          route-table-id: 1001
      - name: tenant1
        type: vlan
        state: up
        vlan:
          base-iface: eth-trunk
          id: 100
        ipv4:
          enabled: true
          address:
            - ip: 198.51.100.2
              prefix-length: 30
        ipv6:
          enabled: true
          address:
            - ip: 2001:db8:100::2
              prefix-length: 127

      # --- Tenant 2 -----------------------------------------------------
      - name: vrf-tenant2
        type: vrf
        state: up
        vrf:
          port:
            - tenant2
          route-table-id: 1002
      - name: tenant2
        type: vlan
        state: down
        vlan:
          base-iface: eth-trunk
          id: 200
        ipv4:
          enabled: true
          address:
            - ip: 203.0.113.2
              prefix-length: 30

      # Internal-facing VLAN, just like a tenant's but left in the default
      # VRF (no vrf: interface enslaving it). This is where the networks
      # advertised by each tenant's BGP session are actually reachable
      # from; route-rules below steer traffic for them into the matching
      # tenant VRF no matter where it originates.
      - name: eth-lan
        type: vlan
        state: up
        vlan:
          base-iface: eth-trunk
          id: 999
        ipv4:
          enabled: true
          address:
            - ip: 10.0.2.1
              prefix-length: 24
        ipv6:
          enabled: true
          address:
            - ip: 2001:db8:2::1
              prefix-length: 64

    routes:
      config:
        # Gives each tenant VRF's BGP "network" statement (in frr-config's
        # frr.conf) a route to actually advertise. One entry per tenant,
        # pointing at wherever that tenant's network is reachable from
        # (here: further inside the LAN, via eth-lan).
        - destination: 10.0.0.0/24
          next-hop-address: 10.0.2.254
          next-hop-interface: eth-lan
          table-id: 1001
        - destination: 10.0.1.0/24
          next-hop-address: 10.0.2.254
          next-hop-interface: eth-lan
          table-id: 1002
        # Same idea, IPv6: only needed for tenants that actually peer over
        # IPv6 (here: tenant1 - see nmstate's "ipv6:" block above).
        - destination: 2001:db8:a::/64
          next-hop-address: 2001:db8:2::254
          next-hop-interface: eth-lan
          table-id: 1001

    route-rules:
      config:
        # PBR: traffic sourced from a network that is advertised over a
        # given tenant's BGP session is forwarded using that tenant's VRF
        # routing table - regardless of which interface/VRF it physically
        # arrives on. This is a flat list, so it scales to many tenants:
        # each one just adds one more VLAN+VRF interface pair + routes
        # entry + route-rules entry with its own VLAN id, route-table id
        # and priority (a ConfigMap for ~150 tenants would typically be
        # generated rather than hand-written, but the format itself
        # doesn't change, and none of it needs a VM restart).
        - ip-from: 10.0.0.0/24
          priority: 1000
          route-table: 1001
        - ip-from: 10.0.1.0/24
          priority: 1010
          route-table: 1002
        # IPv4 and IPv6 rules live in separate kernel rule databases (`ip
        # rule` vs. `ip -6 rule`), so this priority can't collide with the
        # ones above even though the numbers are reused across tables.
        - ip-from: 2001:db8:a::/64
          priority: 1000
          route-table: 1001
