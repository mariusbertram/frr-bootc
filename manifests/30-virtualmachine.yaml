# Example KubeVirt VirtualMachine running the frr-bootc containerDisk image
# directly (pulled fresh on every start). See
# manifests/31-virtualmachine-datavolume.yaml for the alternative
# CDI-DataVolume-backed variant - apply one or the other, not both.
#
# Prerequisites:
#   - OpenShift Virtualization (CNV) with the virtiofs feature gate enabled,
#     e.g.:
#       oc patch hyperconverged kubevirt-hyperconverged -n openshift-cnv \
#         --type=json -p '[{"op":"add","path":"/spec/featureGates/-","value":"ExperimentalVirtiofsSupport"}]'
#     (the exact feature gate name/CR shape depends on your CNV version -
#     check the release notes)
#   - The frr-config, network-config and bootc-config ConfigMaps applied
#     (see 10-configmap-frr-config.yaml, 11-configmap-network-config.yaml,
#     12-configmap-bootc-config.yaml)
#   - The NetworkAttachmentDefinitions applied (see
#     20-networkattachmentdefinition.yaml)
#   - <registry>/frr-bootc-containerdisk:latest pushed and reachable from
#     the cluster (see build.sh)
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: frr-bootc
  namespace: frr-bootc
spec:
  running: true
  template:
    metadata:
      labels:
        kubevirt.io/domain: frr-bootc
    spec:
      domain:
        cpu:
          cores: 2
        memory:
          guest: 2Gi
        devices:
          # Recommended whenever cores > 1 and interfaces use the "bridge"
          # binding - gives each vNIC multiple queues so it can actually
          # scale with vCPU count instead of pinning all its traffic to a
          # single one. See README for further high-throughput/production
          # knobs (dedicatedCpuPlacement, hugepages, SR-IOV) not turned on
          # by this minimal example.
          networkInterfaceMultiqueue: true
          disks:
            - name: containerdisk
              disk:
                bus: virtio
          interfaces:
            # Default pod network, only used for management access to the VM.
            - name: default
              masquerade: {}
            # Only two additional, explicitly-named and MAC-pinned
            # interfaces total, regardless of tenant count: "eth-trunk"
            # carries one VLAN per tenant (added/removed entirely via
            # network-config, no VM change), "eth-lan" is the internal
            # uplink. Each MAC here MUST match the corresponding entry in
            # the network-config ConfigMap's interfaces.yaml so
            # frr-bootc-gen-links names it correctly inside the guest
            # regardless of PCI order.
            - name: eth-trunk
              macAddress: "02:00:00:12:34:01"
              bridge: {}
            - name: eth-lan
              macAddress: "02:00:00:12:34:02"
              bridge: {}
          filesystems:
            - name: frr-config
              virtiofs: {}
            - name: network-config
              virtiofs: {}
            - name: bootc-config
              virtiofs: {}
      networks:
        - name: default
          pod: {}
        - name: eth-trunk
          multus:
            networkName: trunk
        - name: eth-lan
          multus:
            networkName: lan
      volumes:
        - name: containerdisk
          containerDisk:
            image: <registry>/frr-bootc-containerdisk:latest
        - name: frr-config
          configMap:
            name: frr-config
        - name: network-config
          configMap:
            name: network-config
        - name: bootc-config
          configMap:
            name: bootc-config
