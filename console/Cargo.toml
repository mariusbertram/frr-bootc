[package]
name = "frr-console"
version = "0.1.0"
edition = "2021"
description = "Always-on router status dashboard for frr-bootc's console (tty1/ttyS0)"
publish = false

[dependencies]
crossterm = "0.29.0"
frr-vty = { path = "../frr-vty" }
libc = "0.2.189"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
